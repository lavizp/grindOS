<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f7" />
    <meta
      name="description"
      content="Track workouts, sleep and spending. Works offline; your data stays on your device."
    />
    <!-- Installed to the iOS home screen: full screen, with the app's own name. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="grindOS" />
    <title>grindOS</title>
    <script>
      // Apply the theme before first paint. Mirrors applyTheme() in src/lib/theme.ts.
      try {
        var t = localStorage.getItem('grindos-theme') || 'system'
        var dark =
          t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
